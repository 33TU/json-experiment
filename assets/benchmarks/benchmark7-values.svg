<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1572" viewBox="0 0 1500 1572" role="img" aria-labelledby="title desc">
  <title id="title">Values and structs — Benchmark 7</title>
  <desc id="desc">Five-run median JSON marshal latency. Owned-output and reusable-output APIs are compared separately. Lower is better.</desc>
