<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Large nested struct parallel scaling</title>
  <desc id="desc">Aggregate JSON encoding throughput from one to 32 logical CPUs for json-experiment and Sonic on an AMD Ryzen 9 9950X3D. MarshalAppend reaches 24.99 gigabytes per second at 16 CPUs versus 8.39 for Sonic EncodeInto.</desc>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d8dee9}.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:28px;font-weight:700}.subtitle{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;fill:#aab4c3}.series{font-size:14px;fill:#c4ccd8}.tick{font-size:13px;fill:#8794a6}.axis{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;font-weight:650;fill:#aab4c3}.value{font-size:13px;font-weight:700}.grid{stroke:#293344;stroke-width:1}.physical{stroke:#5d6a7c;stroke-width:1;stroke-dasharray:5 5}.append{fill:none;stroke:#50c878;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.marshal{fill:none;stroke:#50c878;stroke-width:4;stroke-dasharray:10 7;stroke-linejoin:round;stroke-linecap:round}.sonic-into{fill:none;stroke:#b388eb;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.sonic-marshal{fill:none;stroke:#b388eb;stroke-width:4;stroke-dasharray:10 7;stroke-linejoin:round;stroke-linecap:round}.point-green{fill:#50c878}.point-purple{fill:#b388eb}.panel{fill:#151c27}</style>
  <rect width="1500" height="650" rx="14" fill="#10151d"/>
  <text class="title" x="40" y="48">Large nested struct — parallel scaling</text>
  <text class="subtitle" x="40" y="76">Go 1.26 · GOAMD64=v3 · JSON v2 + SIMD · Ryzen 9 9950X3D · three-run median</text>

  <line x1="40" y1="102" x2="78" y2="102" class="append"/><text class="series" x="88" y="107">MarshalAppend</text>
  <line x1="250" y1="102" x2="288" y2="102" class="marshal"/><text class="series" x="298" y="107">Marshal</text>
  <line x1="405" y1="102" x2="443" y2="102" class="sonic-into"/><text class="series" x="453" y="107">Sonic EncodeInto</text>
  <line x1="665" y1="102" x2="703" y2="102" class="sonic-marshal"/><text class="series" x="713" y="107">Sonic Marshal</text>
  <text class="subtitle" x="1460" y="107" text-anchor="end">Aggregate throughput; higher is better.</text>

  <rect class="panel" x="25" y="125" width="1450" height="465" rx="10"/>

  <line class="grid" x1="145" y1="545" x2="1405" y2="545"/><text class="tick" x="130" y="550" text-anchor="end">0</text>
  <line class="grid" x1="145" y1="480" x2="1405" y2="480"/><text class="tick" x="130" y="485" text-anchor="end">5</text>
  <line class="grid" x1="145" y1="415" x2="1405" y2="415"/><text class="tick" x="130" y="420" text-anchor="end">10</text>
  <line class="grid" x1="145" y1="350" x2="1405" y2="350"/><text class="tick" x="130" y="355" text-anchor="end">15</text>
  <line class="grid" x1="145" y1="285" x2="1405" y2="285"/><text class="tick" x="130" y="290" text-anchor="end">20</text>
  <line class="grid" x1="145" y1="220" x2="1405" y2="220"/><text class="tick" x="130" y="225" text-anchor="end">25</text>
  <line class="grid" x1="145" y1="155" x2="1405" y2="155"/><text class="tick" x="130" y="160" text-anchor="end">30</text>
  <text class="axis" transform="translate(58 350) rotate(-90)" text-anchor="middle">Aggregate throughput (GB/s)</text>

  <line class="physical" x1="1130" y1="145" x2="1130" y2="555"/>
  <text class="tick" x="1120" y="174" text-anchor="end">16 physical cores</text>

  <polyline class="append" points="170,521.5 410,498.2 650,453.5 890,366.4 1130,220.1 1370,179.8"/>
  <polyline class="marshal" points="170,526.9 410,512.1 650,487.2 890,464.8 1130,444.6 1370,432.6"/>
  <polyline class="sonic-into" points="170,530.8 410,518.1 650,488.2 890,458.2 1130,435.9 1370,417.6"/>
  <polyline class="sonic-marshal" points="170,532.3 410,522.3 650,505.5 890,490.4 1130,482.1 1370,474.8"/>

  <g class="point-green"><circle cx="170" cy="521.5" r="5"/><circle cx="410" cy="498.2" r="5"/><circle cx="650" cy="453.5" r="5"/><circle cx="890" cy="366.4" r="5"/><circle cx="1130" cy="220.1" r="5"/><circle cx="1370" cy="179.8" r="5"/></g>
  <g class="point-green"><circle cx="170" cy="526.9" r="4"/><circle cx="410" cy="512.1" r="4"/><circle cx="650" cy="487.2" r="4"/><circle cx="890" cy="464.8" r="4"/><circle cx="1130" cy="444.6" r="4"/><circle cx="1370" cy="432.6" r="4"/></g>
  <g class="point-purple"><circle cx="170" cy="530.8" r="5"/><circle cx="410" cy="518.1" r="5"/><circle cx="650" cy="488.2" r="5"/><circle cx="890" cy="458.2" r="5"/><circle cx="1130" cy="435.9" r="5"/><circle cx="1370" cy="417.6" r="5"/></g>
  <g class="point-purple"><circle cx="170" cy="532.3" r="4"/><circle cx="410" cy="522.3" r="4"/><circle cx="650" cy="505.5" r="4"/><circle cx="890" cy="490.4" r="4"/><circle cx="1130" cy="482.1" r="4"/><circle cx="1370" cy="474.8" r="4"/></g>

  <text class="value" x="1390" y="176" fill="#50c878">28.09</text>
  <text class="value" x="1390" y="415" fill="#b388eb">9.80</text>
  <text class="value" x="1390" y="440" fill="#50c878">8.65</text>
  <text class="value" x="1390" y="480" fill="#b388eb">5.40</text>

  <text class="tick" x="170" y="574" text-anchor="middle">1</text>
  <text class="tick" x="410" y="574" text-anchor="middle">2</text>
  <text class="tick" x="650" y="574" text-anchor="middle">4</text>
  <text class="tick" x="890" y="574" text-anchor="middle">8</text>
  <text class="tick" x="1130" y="574" text-anchor="middle">16</text>
  <text class="tick" x="1370" y="574" text-anchor="middle">32</text>
  <text class="axis" x="775" y="613" text-anchor="middle">GOMAXPROCS</text>
  <text class="subtitle" x="40" y="635">4,740-byte payload · b.RunParallel · private reusable buffer per worker · solid = reusable output · dashed = owned output</text>
</svg>
