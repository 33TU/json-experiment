  <text class="title" x="40" y="48">UTF-8 and marshaling interfaces — Benchmark 7</text>
  <text class="subtitle" x="40" y="76">Go 1.26 · GOAMD64=v3 · JSON v2 + SIMD · Ryzen 9 9950X3D · five-run median · lower is better</text>
